<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحويلات وتحميلات الفواتير الصينية</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2a24;--mute:#6b766f;--acc:#0f7a55;--line:#e1ddd2;--res:#eaf5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--ink:#e8efe9;--mute:#98a59d;--acc:#3fcf97;--line:#2b3731;--res:#16301f}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--ink:#e8efe9;--mute:#98a59d;--acc:#3fcf97;--line:#2b3731;--res:#16301f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px}
.w{max-width:480px;margin:0 auto}
input{width:100%;font-size:18px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);direction:ltr;text-align:right}
input.t{direction:rtl;font-size:16px}
input:focus{outline:2px solid var(--acc)}
#shop{font-size:19px;font-weight:700;text-align:center;border:0;background:transparent;margin:4px 0 10px;direction:rtl}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;font-size:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 5px}
.card>label:first-child{margin-top:0}
.row{display:flex;gap:10px}.row>div{flex:1}
.seg{display:flex;gap:8px}
.seg button,.b{font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--acc);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button{flex:1;border-color:var(--line);font-size:18px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.b{background:var(--acc);color:#fff}.b.alt{background:transparent;color:var(--acc)}
.gr{display:flex;gap:10px;margin-bottom:12px}
#go{flex:2;font-size:22px;font-weight:700;padding:15px;border:0;border-radius:16px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#12a06f,#0b6b4a);box-shadow:0 6px 16px rgba(15,122,85,.35);transition:transform .1s,box-shadow .1s}
#go:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 6px rgba(15,122,85,.35)}
#cl{flex:1;font-size:16px;padding:15px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#cl:active{transform:scale(.97)}
.chips{display:flex;gap:8px;margin-top:8px}.chips input{flex:1.7;min-width:0;padding:9px;font-size:16px}.chips button{flex:1;padding:9px 0;font-size:15px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pv{direction:ltr;display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0}.pv b{font-size:30px;color:var(--acc);min-width:90px;text-align:center;direction:ltr}.pv button{width:48px;height:48px;font-size:26px;border-radius:50%;border:1px solid var(--acc);background:var(--bg);color:var(--acc);cursor:pointer}
#prg{width:100%;accent-color:var(--acc);height:34px;padding:0;border:0;background:transparent}.pr{display:flex;justify-content:space-between;direction:ltr;color:var(--mute);font-size:12px}
.res{background:var(--res)}
.l{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.l:last-child{border:0}.l b{direction:ltr}
.big{font-size:20px;color:var(--acc);padding:10px 0;gap:8px}.big b{font-size:24px;white-space:nowrap}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.it span{display:block;color:var(--mute);font-size:12px}
.x{background:none;border:0;color:#c0392b;font-size:18px;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:8px}
.ih{text-align:center;margin-bottom:8px}.ih h2{margin:0 0 4px;font-size:20px}.ih div{color:var(--mute);font-size:13px}
small{display:block;text-align:center;color:var(--mute);margin-top:4px}
@media print{body{background:#fff!important;padding:0}#shop,.tabs,.np,#calc,#his{display:none!important}#ivc{background:#fff!important;border:0}#ivc *{color:#000!important}}
</style>
</head>
<body>
<div class="w">
<input id="shop" type="text" value="تحويلات وتحميلات الفواتير الصينية">
<div class="tabs">
<button id="t_calc" class="on">🧮 الحاسبة</button>
<button id="t_his">🕘 السجل</button>
</div>

<section id="calc">
<div class="card">
<label>اسم المحل / نوع البضاعة (اختياري)</label>
<input id="nm" class="t" type="text">
<label>المبلغ باليوان</label>
<input id="amt" type="text" inputmode="decimal" placeholder="0">
<label>سعر اليوان</label>
<div class="seg" id="seg"></div>
<input id="r1" type="hidden" value="6.1"><input id="r2" type="hidden" value="6.7">
<div class="row"><div><label>إضافات بالدولار</label><input id="extra" type="text" inputmode="decimal" placeholder="0"></div>
<div><label>سعر الدولار بالدينار</label><input id="iqd" type="text" inputmode="decimal" placeholder="1550"></div></div>
<label>تحميل % على الناتج (اختياري)</label>
<input id="pct" type="hidden">
<button class="b alt" id="ptog" style="width:100%">➕ إضافة تحميل</button>
<div id="pc" hidden>
<div class="pv"><button id="pm">−</button><b id="pvv">50%</b><button id="pplus">+</button></div>
<input id="prg" type="range" min="50" max="200" step="1" value="50" dir="ltr">
<div class="pr"><span>50</span><span>200</span></div>
<button class="x" id="poff" style="width:100%;font-size:14px">إلغاء التحميل</button>
</div>
</div>
<div class="gr"><button id="go">احسب</button><button id="cl">🗑 مسح</button></div>
<div class="card res" id="rc" hidden>
<div class="l"><span>المبلغ بالدولار</span><b id="o1"></b></div>
<div class="l"><span>+ الإضافات</span><b id="o2"></b></div>
<div class="l big"><span>المجموع بالدولار</span><b id="o3"></b></div>
<div class="l big"><span>المجموع بالدينار</span><b id="o4"></b></div>
<div id="mk"><div class="l"><span>+ التحميل <span id="pp"></span></span><b id="o7"></b></div>
<div class="l big"><span>الإجمالي بعد التحميل</span><b id="o8"></b></div></div>
</div>
<div class="g">
<button class="b alt" id="sv">💾 للسجل</button>
<button class="b alt" id="cp">📋 نسخ</button>
</div>
<small>المعادلة: (يوان ÷ السعر + الإضافات) × سعر الدولار</small>
</section>

<section id="his" hidden>
<div class="card"><div id="hl"></div></div>
<button class="b alt" id="hx" style="width:100%">🗑 مسح السجل</button>
</section>
</div>

<script>
var $=function(i){return document.getElementById(i)};
function en(t){return String(t).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[٫،]/g,".").replace(/[٬,\s]/g,"").replace(/[^0-9.\-]/g,"")}
function n(i){var v=parseFloat(en($(i).value));return isNaN(v)?0:v}
function f(x,d){return x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function now(){var d=new Date(),z=function(x){return (x<10?"0":"")+x};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes())}
var S={sel:1,items:[],hist:[],rates:[]};
var ids=["shop"];
try{var o=JSON.parse(localStorage.getItem("cc2")||"null");if(o){S=Object.assign(S,o);if(S.v)ids.forEach(function(i){if(S.v[i]!==undefined)$(i).value=S.v[i]})}}catch(e){}
if($("shop").value==="فاتورة المحل"||$("shop").value==="معادلات التحويل")$("shop").value="تحويلات وتحميلات الفواتير الصينية";
function save(){S.v={};ids.forEach(function(i){S.v[i]=$(i).value});try{localStorage.setItem("cc2",JSON.stringify(S))}catch(e){}}
function flash(b,t){var o=b.textContent;b.textContent=t;setTimeout(function(){b.textContent=o},1400)}
function sure(b,fn){if(b._s){b._s=0;b.textContent=b._o;fn();return}b._s=1;b._o=b.textContent;b.textContent="اضغط للتأكيد";setTimeout(function(){if(b._s){b._s=0;b.textContent=b._o}},2500)}
function copy(t,b){var ok=function(){flash(b,"✅ تم النسخ")};function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(a)}try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function tab(t){["calc","his"].forEach(function(k){$(k).hidden=k!==t;$("t_"+k).className=k===t?"on":""});if(t=="his")rHis()}
["calc","his"].forEach(function(k){$("t_"+k).onclick=function(){tab(k)}});

function cur(){var r=n("r"+S.sel),usd=(r>0?n("amt")/r:0)+n("extra"),dr=n("iqd")||1550,base=Math.round(usd*dr),pct=n("pct"),mark=Math.round(base*pct/100);
return {nm:$("nm").value.trim(),yuan:n("amt"),rate:r,extra:n("extra"),iqd:base,usd:usd,dr:dr,pct:pct,mark:mark,fin:base+mark}}
function line(o){return (o.nm?o.nm+" - ":"")+f(o.yuan,2)+" يوان (سعر "+o.rate+") = $"+f(o.usd,2)+" = "+f(o.iqd,0)+" د.ع"}
function seg(){$("seg").innerHTML="";[1,2].forEach(function(k){var b=document.createElement("button");b.textContent=$("r"+k).value||"0";if(S.sel===k)b.className="on";b.onclick=function(){S.sel=k;hide()};$("seg").appendChild(b)})}
function calc(){var c=cur();
$("o1").textContent="$ "+f(c.usd-c.extra,2);$("o2").textContent="$ "+f(c.extra,2);$("o3").textContent="$ "+f(c.usd,2);
$("o4").textContent=f(c.iqd,0)+" د.ع";$("mk").style.display=c.pct>0?"block":"none";$("pp").textContent="("+c.pct+"%)";$("o7").textContent=f(c.mark,0)+" د.ع";$("o8").textContent=f(c.fin,0)+" د.ع";
pUI();document.title=$("shop").value||"تحويلات وتحميلات الفواتير الصينية";seg();save()}
function setP(v){$("pct").value=v?String(v):"";hide()}
function pUI(){var p=n("pct");$("ptog").hidden=p>0;$("pc").hidden=!(p>0);$("pvv").textContent=p+"%";$("prg").value=p}
$("ptog").onclick=function(){setP(50)};
$("poff").onclick=function(){setP(0)};
$("pm").onclick=function(){setP(Math.max(50,n("pct")-1))};
$("pplus").onclick=function(){setP(Math.min(200,n("pct")+1))};
$("prg").oninput=function(){setP(parseInt(this.value,10))};
function hide(){$("rc").hidden=true;calc()}
function show(){calc();$("rc").hidden=false}
$("go").onclick=function(){show();try{$("rc").scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){}};
["shop","nm","amt","extra","iqd","pct"].forEach(function(i){$(i).addEventListener("input",i=="shop"?calc:hide);$(i).addEventListener("keydown",function(e){if(e.key=="Enter"||e.keyCode==13)$("go").click()})});

$("sv").onclick=function(){if(!n("amt"))return;var c=cur();S.hist.unshift({t:"c",d:now(),l:c.nm||(f(c.yuan,2)+" يوان"),tot:c.fin,data:c});S.hist=S.hist.slice(0,200);save();flash($("sv"),"✅ انحفظت")};
$("cp").onclick=function(){var c=cur();copy(($("shop").value||"تحويلات وتحميلات الفواتير الصينية")+"\n"+(c.nm?c.nm+"\n":"")+"المبلغ: "+f(c.yuan,2)+" يوان (سعر "+c.rate+")\nبالدولار: $"+f(c.usd,2)+"\nالمجموع بالدينار: "+f(c.iqd,0)+" د.ع"+(c.pct>0?"\nالتحميل ("+c.pct+"%): "+f(c.mark,0)+" د.ع\nالإجمالي بعد التحميل: "+f(c.fin,0)+" د.ع":""),$("cp"))};
$("cl").onclick=function(){["amt","nm","extra","pct"].forEach(function(i){$(i).value=""});hide();$("amt").focus()};

function rHis(){var L=$("hl");L.innerHTML=S.hist.length?"":'<div class="empty">السجل فارغ</div>';
S.hist.forEach(function(h,i){var d=document.createElement("div");d.className="it";
d.innerHTML='<div style="flex:1;cursor:pointer">'+"🧮 "+esc(h.l)+"<span>"+h.d+"</span></div><div><b>"+f(h.tot,0)+"</b> <button class='x'>✕</button></div>";
d.firstChild.onclick=function(){loadH(h)};d.querySelector(".x").onclick=function(){S.hist.splice(i,1);save();rHis()};L.appendChild(d)})}
function loadH(h){var o=h.data;$("nm").value=o.nm;$("amt").value=o.yuan;S.sel=o.rate==n("r2")?2:1;$("extra").value=o.extra||"";$("iqd").value=o.dr==1550?"":o.dr;$("pct").value=o.pct||"";show();tab("calc")}
$("hx").onclick=function(){sure($("hx"),function(){S.hist=[];save();rHis()})};

S.hist=S.hist.filter(function(h){return h.t!="i"});S.items=[];calc();
</script>
</body>
</html>
